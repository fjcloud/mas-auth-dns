apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: auth-dns
objects:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: auth-dns
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: auth-dns
    namespace: auth-dns
  spec:
    replicas: 2
    selector:
      matchLabels: {app: auth-dns}
    template:
      metadata:
        labels: {app: auth-dns}
      spec:
        containers:
        - name: coredns
          image: ${IMAGE}
          command: ["/bin/sh", "-ec"]
          args:
          - |
            cat >/tmp/Corefile <<EOF
            $AUTH_HOST:5353 {
                hosts {
                    $ROUTER_IP $AUTH_HOST
                    ttl 30
                }
                errors
            }
            .:5353 {
                forward . /etc/resolv.conf
                errors
            }
            EOF
            exec coredns -conf /tmp/Corefile
          env:
          - {name: AUTH_HOST, value: "${AUTH_HOST}"}
          - {name: ROUTER_IP, value: "${ROUTER_IP}"}
          ports:
          - {name: dns-udp, containerPort: 5353, protocol: UDP}
          - {name: dns-tcp, containerPort: 5353, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
- apiVersion: v1
  kind: Service
  metadata:
    name: auth-dns
    namespace: auth-dns
  spec:
    selector: {app: auth-dns}
    ports:
    - {name: dns-udp, port: 5353, protocol: UDP, targetPort: 5353}
    - {name: dns-tcp, port: 5353, protocol: TCP, targetPort: 5353}
parameters:
- name: AUTH_HOST
  required: true
  description: Public auth route hostname
- name: ROUTER_IP
  required: true
  description: router-default Service ClusterIP
- name: IMAGE
  value: registry.redhat.io/openshift4/ose-coredns-rhel9:v4.22
  description: CoreDNS image. Use v plus the cluster minor, for example v4.22
